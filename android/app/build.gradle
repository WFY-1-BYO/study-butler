plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studybutler.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.studybutler.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 关掉所有关于 Google 服务的依赖检查
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // 刻意不引入任何 com.google.* / androidx.* 依赖
    // 全部用 Android 原生 API，包体极小、无外部服务
}

// 每次构建前把根目录的 index.html 同步进 assets，
// 避免改了页面却打出旧版本的包（v1.2 就踩过这个坑）
tasks.register('syncWeb', Copy) {
    from rootProject.projectDir.toPath().resolve('..').resolve('index.html').toFile()
    into 'src/main/assets'
}

tasks.configureEach { t ->
    if (t.name == 'preBuild') t.dependsOn 'syncWeb'
}
